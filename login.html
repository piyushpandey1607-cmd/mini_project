<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header class="logo">
        <a href="index.html" target="_self">amazon<span class="smile"></span></a>
    </header>
    <main class="login-container">
        <h1>Sign in or create<br>account</h1>
        <form>
            <label for="email">Enter mobile number or email</label>

            <input  type="text" id="email" name="email" required >

            <button type="submit">Continue</button>
        </form>

        <p class="terms">
            By continuing, you agree to Amazon's
            <a href="#">Conditions of Use</a> and
            <a href="#">Privacy Notice</a>.
        </p>

        <a href="#" class="help">Need help?</a>
        <hr>
        <div class="business">
            <h3>Buying for work?</h3>
            <a href="#">Create a free business account</a>
        </div>

    </main>
    <footer>
        <div class="footer-links">
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </div>

        <p>
            © 1996-2026, Amazon.com, Inc. or its affiliates
        </p>
    </footer>

</body>
</html>
